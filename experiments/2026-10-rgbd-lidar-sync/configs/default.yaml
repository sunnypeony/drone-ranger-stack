# Offline RGB-D (+2D LiDAR) -> TSDF mesh -> OBJ / USD pipeline.
# All paths are relative to the experiment directory (the parent of configs/).

paths:
  data_dir: data
  raw_dir: data/raw            # snapshot_download target (+ extracted archives)
  bag_dir: null                # null = auto-detect the first dir containing metadata.yaml under raw_dir
  outputs_dir: outputs
  results_dir: results

download:
  repo_id: danyangh/static_table_rgbd_2dlaserscan_rosbag_3min
  repo_type: dataset           # retried as "model" if not found
  revision: null
  token_env: HF_TOKEN          # env var holding the token for private repos
  extract_archives: true       # untar *.tar.gz / *.tgz / *.tar / *.zip after download
  delete_archive_after_extract: false
  min_free_disk_gb: 5.0        # stop if free disk drops below this

topics:
  rgb: /oak/rgb/image_raw
  depth: /oak/depth/image_raw
  camera_info: /oak/rgb/camera_info
  scan: /scan
  tf: /tf
  tf_static: /tf_static
  odom: /odom                  # optional, may be absent

frames:
  odom: odom
  base: base_link
  camera_optical: oak_rgb_camera_optical_frame
  laser: laser_frame

typestore: ROS2_HUMBLE

inspect:
  sample_frame_index: 50       # which matched RGB-D pair to dump (clamped to available)
  allowed_depth_encodings: [16UC1, mono16, 32FC1]
  depth_stats_every: 10        # compute valid-pixel stats on every Nth depth image
  odom_coverage_threshold: 0.9 # fraction of frames inside odom->base coverage to call it "available"
  max_tf_gap_s: 0.5            # a gap longer than this in the odom->base stream breaks coverage
  sample_pointcloud_stride: 2  # pixel stride when building frame0.ply

extract:
  match_tolerance_ns: 0        # 0 = exact header.stamp match; >0 = nearest-neighbour fallback
  frame_stride: 2
  depth_min: 0.3               # m
  depth_max: 4.0               # m
  depth_32fc1_scale: 1.0       # 32FC1 depth is in metres (REP 117)
  depth_16uc1_scale: 0.001     # 16UC1 depth is in millimetres
  denoise: none                # none | median | bilateral
  median_ksize: 5
  bilateral_d: 5
  bilateral_sigma_color_mm: 30.0
  bilateral_sigma_space: 5.0
  undistort: auto              # auto | true | false
  undistort_alpha: 0.0         # getOptimalNewCameraMatrix alpha (0 = crop to valid pixels)
  zero_d_eps: 1.0e-9

poses:
  pose_source: auto            # auto | bag_tf | open3d
  compare_both: true           # if bag odom exists AND open3d is runnable, compute both and compare
  tf_interp_max_gap_s: 0.5     # do not interpolate across TF gaps larger than this
  # --- open3d odometry ---
  keyframe_stride: 1           # use every Nth extracted frame as a keyframe
  odometry_depth_max: 3.0      # m, depth cutoff used for odometry
  odometry_depth_diff_max: 0.07
  odometry_min_depth: 0.3
  odometry_iterations: [20, 10, 5]   # coarse -> fine pyramid levels
  odometry_min_valid_ratio: 0.05     # skip/flag pairs whose depth is mostly empty
  odometry_max_translation: 0.3      # m per keyframe step; larger = treat as failure
  odometry_max_rotation_deg: 20.0    # per keyframe step; larger = treat as failure
  odometry_info_min: 1000.0          # min info[5,5] (point count proxy); smaller = failure
  odometry_fail_info_scale: 1.0      # information (x I6) of an extrapolated (failed) odometry edge
  # --- loop closure ---
  loop_min_gap_s: 20.0
  loop_max_dist: 1.0           # m, candidate gate on current pose estimate
  loop_max_angle_deg: 45.0
  loop_candidate_stride: 5     # only test every Nth keyframe as loop target
  loop_max_candidates_per_frame: 3
  loop_query_stride: 5         # only query every Nth keyframe
  loop_force_head_tail: 15     # force first N vs last N keyframes (sub-sampled)
  loop_force_stride: 3
  icp_voxel: 0.04              # m, voxel for colored ICP
  icp_max_iter: [50, 30, 14]
  icp_radius_scales: [4.0, 2.0, 1.0]  # x icp_voxel per level
  icp_min_points: 500
  icp_normal_radius_scale: 2.0
  icp_normal_max_nn: 30
  icp_rel_eps: 1.0e-6
  icp_eval_dist_scale: 1.5     # x icp_voxel, correspondence distance for fitness/RMSE/information
  loop_fitness_min: 0.3
  loop_rmse_max: 0.03          # m
  loop_odometry_info_min: 3000.0
  # --- pose graph ---
  pg_max_correspondence_distance: 0.05
  pg_edge_prune_threshold: 0.25
  pg_preference_loop_closure: 1.0
  pg_reference_node: 0
  # --- checkpoint ---
  checkpoint_every: 50         # write odometry checkpoint every N keyframe pairs
  # --- outputs ---
  preview_every: 10
  preview_voxel: 0.03
  preview_depth_max: 3.0
  head_tail_warn_m: 0.3
  rigid_det_tol: 1.0e-3
  rigid_orth_tol: 1.0e-3

tsdf:
  voxel_length: 0.02
  sdf_trunc: 0.08
  depth_scale: 1000.0
  depth_trunc: null            # null = extract.depth_max
  frame_stride: 1              # integrate every Nth posed frame
  checkpoint_every: 200        # frames; partial mesh/pointcloud checkpoint (resume = re-integrate up to done frames)

mesh:
  min_cluster_ratio: 0.02      # keep largest cluster + clusters with area > ratio * total area
  target_triangles: 200000
  level_ground: true
  ground_distance_threshold: 0.03
  ground_ransac_n: 3
  ground_num_iterations: 2000
  ground_max_planes: 5         # iterate RANSAC up to N planes, pick the best ground
  ground_max_angle_deg: 35.0   # plane normal vs current up direction
  ground_min_inliers: 2000
  ground_sample_points: 300000 # sample points from mesh for RANSAC
  up_axis_hint: auto           # auto | +z | -y  (auto: +z if world is base_link-like, -y if world = first optical frame)
  max_result_file_mb: 90       # results/ file limit; halve target_triangles until satisfied

usd:
  filename: scene_collision.usdc
  write_usda: false
  convex_decomp: true
  convex_decomp_filename: scene_collision_convexdecomp.usdc
  meters_per_unit: 1.0
  up_axis: Z

lidar:
  enabled: true
  scan_stride: 5               # use every Nth scan
  range_min: 0.12
  range_max: 12.0
  slice_half_thickness: 0.05   # m, mesh slice around the laser plane height
  max_time_offset_s: 0.0       # added to scan stamp before trajectory lookup
  plot_extent_margin: 1.0
  max_points_plot: 200000
